# Fait tourner la validation et les tests du mod sur Windows, macOS et Linux à chaque envoi.
# Les tests simulent le panneau (éléments, clics, signal envoyé à Claude) ; ils ne dessinent pas l'écran.
# Claude Code vient de l'installeur officiel : c'est cette version qui a `claude plugin test`.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer Claude Code (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Installer Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Version
        run: claude --version
      - name: Valider le mod
        run: claude plugin validate .
      - name: Tester le mod
        run: claude plugin test .
